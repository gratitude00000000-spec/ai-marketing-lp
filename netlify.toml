# Netlify — Next.js ビルド設定
# 公式ランタイムプラグイン @netlify/plugin-nextjs により
# App Router / サーバーコンポーネント / redirects / headers がそのまま動く。

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Netlify Forms 検出用の静的HTML（public/__forms.html）はビルド出力に含まれる。
